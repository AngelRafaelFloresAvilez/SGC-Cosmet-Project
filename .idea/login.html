<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - SGC Cosmetic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="StylesLogin.css">
</head>
<body>
  <div class="screen">
    <div class="form-card">
      <div class="form-content">
        <div class="form-header">
          <h1>Crear tu cuenta</h1>
          <p>Unete a sgc-cosmetics y disfruta de una experiencia personalizada.</p>
        </div>
        

        <form id="registerForm" class="form-grid" novalidate>
          <div class="input-row">
            <label for="nombre">
              <span>Nombre</span>
              <input id="nombre" name="nombre" type="text" placeholder="Tu nombre" required>
            </label>
            <label for="apellido">
              <span>Apellido</span>
              <input id="apellido" name="apellido" type="text" placeholder="Tu apellido" required>
            </label>
          </div>

          <label class="full-width" for="email">
            <span>Correo electrónico</span>
            <input id="email" name="email" type="email" placeholder="correo@ejemplo.com" required>
          </label>

          <div class="input-row">
            <label for="telefono">
              <span>Teléfono</span>
              <input id="telefono" name="telefono" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="14" placeholder="Tu número" required>
            </label>
            <label for="fecha">
              <span>Fecha de nacimiento</span>
              <input id="fecha" name="fecha" type="date" required>
            </label>
          </div>

          <div class="input-row">
            <label for="password">
              <span>Contraseña</span>
              <input id="password" name="password" type="password" placeholder="Crea una contraseña" required>
            </label>
            <label for="confirmPassword">
              <span>Confirmar contraseña</span>
              <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Repite tu contraseña" required>
            </label>
          </div>


          <button id="registerSubmitButton" type="button" class="btn-primary">Crear cuenta</button>

          <div class="footer-link">
            <span>¿Ya tienes una cuenta?</span>
            <p><a href="Loggin.html">Inicia sesión</a></p>
          </div>
        </form>
      </div>
      <!-- wave separator between form and image -->
      <svg class="wave-separator" viewBox="0 0 240 600" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 0 C60 120, 60 240, 0 360 C-60 480, 60 540, 0 600 L240 600 L240 0 Z" fill="#ffffff" />
      </svg>
      <div class="form-side-image" aria-hidden="true">
        <svg class="side-image-svg" viewBox="0 0 480 600" preserveAspectRatio="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <clipPath id="clipRight">
              <path d="M120 0 C80 120,80 240,120 360 C160 480,80 540,120 600 L480 600 L480 0 Z" />
            </clipPath>
          </defs>
          <image href="../out/production/SGC/ImagenFondoLogin.png" width="480" height="600" clip-path="url(#clipRight)" preserveAspectRatio="xMidYMid slice" />
        </svg>
      </div>
    </div>
  </div>
  <script src="appointments-system.js"></script>
  <script src="login.js"></script>
  <script>
    (function () {
      function showToast(message, type) {
        const containerId = 'sgc-alert-container';
        let container = document.getElementById(containerId);
        if (!container) {
          container = document.createElement('div');
          container.id = containerId;
          container.className = 'sgc-alert-container';
          document.body.appendChild(container);
        }
        const alertEl = document.createElement('div');
        alertEl.className = 'sgc-alert ' + (type || 'info');
        alertEl.textContent = message || '';
        container.appendChild(alertEl);
        setTimeout(() => {
          alertEl.style.transition = 'all 260ms ease';
          alertEl.style.opacity = '0';
          setTimeout(() => alertEl.remove(), 300);
        }, 3000);
      }

      window.showSiteAlert = window.showSiteAlert || showToast;

      const form = document.getElementById('registerForm');
      const button = document.getElementById('registerSubmitButton');
      if (!form || !button) return;

      button.addEventListener('click', function (event) {
        event.preventDefault();
        event.stopPropagation();

        const values = {
          nombre: document.getElementById('nombre')?.value?.trim() || '',
          apellido: document.getElementById('apellido')?.value?.trim() || '',
          email: (document.getElementById('email')?.value || '').trim(),
          telefono: (document.getElementById('telefono')?.value || '').trim(),
          fecha: document.getElementById('fecha')?.value || '',
          password: document.getElementById('password')?.value || '',
          confirm: document.getElementById('confirmPassword')?.value || ''
        };

        const missing = [];
        if (!values.nombre) missing.push('Nombre');
        if (!values.apellido) missing.push('Apellido');
        if (!values.email) missing.push('Correo');
        if (!values.telefono) missing.push('Teléfono');
        if (!values.fecha) missing.push('Fecha de nacimiento');
        if (!values.password) missing.push('Contraseña');
        if (!values.confirm) missing.push('Confirmar contraseña');

        if (missing.length) {
          showToast('Completa los campos: ' + missing.join(', '), 'info');
          return;
        }

        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(values.email)) {
          showToast('Ingresa un correo electrónico válido.', 'error');
          return;
        }

        if (values.password.length < 4 || values.password.length > 16 || !/^[A-Za-z0-9]+$/.test(values.password)) {
          showToast('La contraseña debe tener entre 4 y 16 caracteres alfanuméricos.', 'warning');
          return;
        }

        if (values.password !== values.confirm) {
          showToast('Las contraseñas no coinciden.', 'error');
          return;
        }

        const result = window.appointmentsSystem && typeof window.appointmentsSystem.createUser === 'function'
          ? window.appointmentsSystem.createUser({
              name: values.nombre,
              lastName: values.apellido,
              email: values.email,
              phone: values.telefono,
              birthDate: values.fecha,
              password: values.password,
              role: 'client'
            })
          : { ok: true, user: { role: 'client', email: values.email, name: values.nombre, lastName: values.apellido } };

        if (!result.ok) {
          showToast('Este correo ya está registrado.', 'error');
          return;
        }

        if (window.appointmentsSystem && typeof window.appointmentsSystem.setSession === 'function') {
          window.appointmentsSystem.setSession({
            role: 'client',
            email: values.email,
            name: `${values.nombre} ${values.apellido}`.trim()
          });
        }

        showToast('Cuenta creada correctamente.', 'info');
        setTimeout(() => {
          if (window.appointmentsSystem && typeof window.appointmentsSystem.navigateByRole === 'function') {
            window.appointmentsSystem.navigateByRole('client');
            return;
          }
          window.location.href = 'dashboard.html';
        }, 500);
      });
    })();
  </script>
</html>
