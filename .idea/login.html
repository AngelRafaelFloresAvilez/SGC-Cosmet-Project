<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - SGC Cosmetic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    if (!window.location.pathname.includes('/.idea/')) {
      const b = document.createElement('base');
      b.href = './.idea/';
      document.head.appendChild(b);
    }
  </script>
</head>
<body>
  <div class="screen">
    <div class="form-card">
      <div class="form-side-image" aria-hidden="true"></div>

      <div class="form-content">
        <div class="form-header">
          <h1>Crear tu cuenta</h1>
          <p>Regístrate para administrar tus clientes, citas y servicios desde una sola plataforma.</p>
        </div>

        <form id="registerForm" class="form-grid" action="#" method="post">
          <div class="input-row">
            <label for="nombre">
              <span>Nombre</span>
              <input id="nombre" name="nombre" type="text" placeholder="Tu nombre" required>
            </label>
            <label for="apellido">
              <span>Apellido</span>
              <input id="apellido" name="apellido" type="text" placeholder="Tu apellido" required>
            </label>
          </div>

          <label class="full-width" for="email">
            <span>Correo electrónico</span>
            <input id="email" name="email" type="email" placeholder="correo@ejemplo.com" required>
          </label>

          <div class="input-row">
            <label for="telefono">
              <span>Teléfono</span>
              <input id="telefono" name="telefono" type="tel" placeholder="Tu número" required>
            </label>
            <label for="fecha">
              <span>Fecha de nacimiento</span>
              <input id="fecha" name="fecha" type="date" required>
            </label>
          </div>

          <div class="input-row">
            <label for="password">
              <span>Contraseña</span>
              <input id="password" name="password" type="password" placeholder="Crea una contraseña" required>
            </label>
            <label for="confirmPassword">
              <span>Confirmar contraseña</span>
              <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Repite tu contraseña" required>
            </label>
          </div>

          <button type="submit" class="btn-primary">Crear cuenta</button>

          <div class="footer-link">
            <span>¿Ya tienes una cuenta?</span>
            <a href="Loggin.html">Inicia sesión</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>
<script src="appointments-system.js"></script>
</html>
