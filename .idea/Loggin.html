<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - SGC Cosmetic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="StylesLoggin.css">
  <script src="Loggin.js"></script>
</head>
<body>
  <div class="screen">
    <div class="form-card">
      <div class="form-content">
        <div class="form-header">
          <h1>Iniciar Sesion</h1>
          <p class="hero-copy">¡Bienvenido/a! Hemos preparado este espacio para facilitarte la vida. Comienza a gestionar tus servicios o descubre nuestras promociones exclusivas.</p>
        </div>

        <form id="loginForm" class="form-grid" onsubmit="event.preventDefault();">
          <label for="loginEmail">
            <span class="field-label">Correo</span>
            <input id="loginEmail" name="loginEmail" type="email" placeholder="introduce tu correo" required>
          </label>

          <label for="loginPassword">
            <span class="field-label">Contraseña</span>
            <input id="loginPassword" name="loginPassword" type="password" placeholder="introduce tu contraseña" required>
          </label>

          <div class="form-options">
            <label class="checkbox-row" for="showPassword">
              <input id="showPassword" type="checkbox">
              <span>Mostrar contraseña</span>
            </label>
            <a href="ResetPassword.html" class="secondary-link">Olvidaste la contraseña?</a>
          </div>

          <button id="loginSubmitButton" type="submit" class="btn-primary">Iniciar Sesion</button>

          <div class="footer-link">
            <span>¿No tienes una cuenta de sgc-cosmetic?</span>
            <a href="login.html">Registrate ahora</a>
          </div>
        </form>
      </div>

      <div class="form-side-image" aria-hidden="true"></div>
    </div>
  </div>

  <script src="appointments-system.js"></script>
  <script src="Loggin.js"></script>
</body>
</html>
