<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion de servicios - SGC Cosmetic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="StylesAdmin.css">
</head>
<body data-admin-page="servicios">
  <div class="main-wrapper">
    <section class="page-head">
      <div><h1>Gestion de servicios</h1></div>
      <button class="btn-primary" type="button" id="newServiceBtn">+ Agregar servicio</button>
    </section>

    <section class="stat-row cols-4">
      <article class="stat-note">
        <strong>Informacion de servicios</strong>
        <small>Administra los servicios que ofrece SGC - Cosmetic</small>
      </article>
      <article class="stat-icon"><i class="fa-regular fa-calendar"></i><div><strong id="statCount">0</strong><small>servicios registrados</small></div></article>
      <article class="stat-icon tone-yellow"><i class="fa-regular fa-clock"></i><div><strong id="statDuration">0 min</strong><small>Duracion promedio</small></div></article>
      <article class="stat-icon"><i class="fa-solid fa-dollar-sign"></i><div><strong id="statPrice">$0</strong><small>Precio promedio</small></div></article>
    </section>

    <div class="toolbar">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="search" id="search" placeholder="Buscar servicio...">
      </div>
    </div>

    <div class="table-card">
      <table class="data">
        <thead>
          <tr><th>Servicios</th><th>Descripción</th><th>Duración</th><th>Precio</th><th>Estado</th><th>Acciones</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="pager" id="pager"></div>
  </div>

  <script src="appointments-system.js"></script>
  <script src="admin-data.js"></script>
  <script src="admin-shell.js"></script>
  <script src="admin-servicios.js"></script>
</body>
</html>
