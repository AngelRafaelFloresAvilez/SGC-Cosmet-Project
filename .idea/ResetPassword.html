<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña - SGC Cosmetic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="screen reset-screen">
    <div class="reset-card">
      <div class="reset-panel reset-panel-left">
        <div class="reset-content">
          <h1>Recuperar contraseña</h1>
          <p class="reset-description">Ingresa tu direccion de corre electronico y te enviaremos un enlace para reestablecer tu contraseña.</p>

          <label for="email" class="reset-label">
            <span>Introduce tu correo electronico</span>
            <input id="email" type="email" placeholder="correo@ejemplo.com" required>
          </label>

          <button type="button" class="btn-primary reset-btn" onclick="window.location.href='restablecer.html'">Enviar enlace</button>

          <div class="reset-divider">o</div>

          <a href="Loggin.html" class="back-link">Volver al inicio de sesion</a>
        </div>
      </div>

      <div class="reset-panel reset-panel-right">
        <div class="reset-quote">
          <p>“Tu bienestar es nuestra prioridad.<br/>Estamos aqui para servirte.”</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
