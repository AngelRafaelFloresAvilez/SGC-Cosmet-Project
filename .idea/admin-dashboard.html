<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel del administrador - SGC Cosmetic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="StylesAdmin.css">
</head>
<body data-admin-page="dashboard">
  <div class="main-wrapper">
    <section class="page-head">
      <div>
        <h1>Hola de nuevo, <span id="welcomeName">administrador</span></h1>
        <p id="todayLabel"></p>
      </div>
    </section>

    <section class="stat-row cols-4">
      <article class="stat-bar"><div><strong id="statToday">0</strong><small>Citas realizadas hoy</small></div></article>
      <article class="stat-bar"><div><strong id="statNewClients">0</strong><small>Clientes nuevos este mes</small></div></article>
      <article class="stat-bar"><div><strong id="statSpecialists">0</strong><small>Especialistas activos</small></div></article>
      <article class="stat-bar"><div><strong id="statRevenue">$0</strong><small>Ventas este mes</small></div></article>
    </section>

    <section class="grid-3">
      <article class="panel">
        <div class="panel-head"><span class="panel-title">Citas semanales</span></div>
        <div class="chart-box" id="weeklyChart"></div>
      </article>

      <article class="panel">
        <div class="panel-head">
          <span class="panel-title">Citas pendientes</span>
          <a class="panel-link" href="admin-citas.html?estado=pending">ver mas <i class="fa-solid fa-arrow-right"></i></a>
        </div>
        <div class="pending-list" id="pendingList"></div>
      </article>

      <article class="panel">
        <div class="panel-head">
          <span class="panel-title">Servicios mas solicitados</span>
          <a class="panel-link" href="admin-reportes.html">ver mas <i class="fa-solid fa-arrow-right"></i></a>
        </div>
        <div id="topServicesList"></div>
      </article>
    </section>

    <section class="grid-3">
      <article class="panel">
        <div class="panel-head"><span class="panel-title">Actividad reciente</span></div>
        <div class="activity-list" id="activityList"></div>
      </article>

      <article class="panel">
        <div class="panel-head"><span class="panel-title">Recordatorios</span></div>
        <div class="reminder-list" id="remindersList"></div>
      </article>

      <article class="panel">
        <div class="panel-head">
          <span class="panel-title">Especialistas</span>
          <a class="panel-link" href="admin-empleados.html">ver mas <i class="fa-solid fa-arrow-right"></i></a>
        </div>
        <div class="people-list" id="specialistsList"></div>
      </article>
    </section>
  </div>

  <script src="appointments-system.js"></script>
  <script src="admin-data.js"></script>
  <script src="admin-charts.js"></script>
  <script src="admin-shell.js"></script>
  <script src="admin-dashboard.js"></script>
</body>
</html>
