<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel del especialista - SGC Cosmetic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="StylesSpecialistDashboard.css">
</head>
<body>
  <div class="menu-overlay" id="menuOverlay"></div>
  <aside class="sidebar-menu" id="sidebarMenu">
    <div class="sidebar-user-box">
      <div class="sidebar-user-avatar" id="sidebarUserAvatar"><i class="fa-solid fa-circle-user"></i></div>
      <div class="sidebar-user-meta">
        <span class="sidebar-user-name" id="sidebarUserName">Sofía Vega</span>
        <span class="sidebar-user-role" id="sidebarUserRole">Especialista</span>
      </div>
    </div>
    <div class="sidebar-header"><hr class="sidebar-divider"></div>
    <div class="sidebar-section-label">General</div>
    <nav class="sidebar-nav">
      <a href="specialist-dashboard.html" class="active"><i class="fa-solid fa-house"></i> Inicio</a>
      <a href="agenda.html"><i class="fa-regular fa-calendar"></i> Agenda</a>
      <hr class="sidebar-divider">
      <a href="perfil-especialista.html" class="nav-profile-link"><i class="fa-regular fa-user"></i> Perfil</a>
    </nav>
    <button class="sidebar-logout" type="button" id="specialistSignOut"><i class="fa-solid fa-right-from-bracket"></i> Cerrar sesión</button>
    <hr class="sidebar-divider">
    <div class="sidebar-brand">SGC COSMETICS</div>
  </aside>
  <div class="main-wrapper">
    <header class="topbar">
      <button class="menu-trigger" type="button" aria-label="Abrir menú"><i class="fa-solid fa-bars"></i></button>
      <div class="topbar-actions">
        <div class="specialist-notification-wrap"><button class="notification-trigger" type="button" aria-label="Notificaciones" data-notification-toggle><i class="fa-regular fa-bell"></i><span class="notification-badge"></span></button><div class="notification-panel" id="notificationPanel"><div id="notificationList"></div></div></div>
        <button class="specialist-chip" type="button" id="editProfileBtn" aria-label="Abrir perfil del especialista">
          <img class="chip-avatar" id="specialistAvatar" src="https://www.gravatar.com/avatar/?d=mp&s=150" alt="Especialista">
          <span><strong id="specialistName">Dra. Sofía Reyes</strong><small id="specialistRole">Especialista</small></span>
        </button>
      </div>
    </header>

    <main class="specialist-dashboard">
      <section class="welcome-block">
        <h1>Hola de nuevo, <span id="welcomeName">Dra. Sofía Reyes</span></h1>
        <p id="todayLabel"></p>
      </section>

      <section class="stats">
        <div class="stat stat-calendar"><i class="fa-regular fa-calendar"></i><span><strong id="todayCount">0</strong><small>Citas hoy</small></span></div>
        <div class="stat stat-clock"><i class="fa-regular fa-clock"></i><span><strong id="upcomingCount">0</strong><small>Pendiente</small></span></div>
        <div class="stat stat-check"><i class="fa-regular fa-circle-check"></i><span><strong id="completedCount">0</strong><small>Citas completadas</small></span></div>
        <div class="stat stat-star"><i class="fa-regular fa-star"></i><span><strong id="averageRating">0</strong><small>Calificación promedio</small></span></div>
      </section>

      <section class="dashboard-columns">
        <div class="dashboard-panel agenda-panel" id="agenda">
          <div class="section-title">Agenda hoy</div>
        <div class="filters">
          <button class="filter-btn active" data-range="day">Día</button>
          <button class="filter-btn" data-range="week">Semana</button>
          <button class="filter-btn" data-range="month">Mes</button>
        </div>
        <div class="appointment-list" id="appointmentList"></div>
        <div class="dashboard-pager" id="agendaPager" aria-label="Paginación de agenda"></div>
        </div>
        <div class="dashboard-panel upcoming-panel">
          <div class="section-title">Próximas citas</div>
          <div id="upcomingAppointmentsList" class="upcoming-list"></div>
          <div class="dashboard-pager" id="upcomingPager" aria-label="Paginación de próximas citas"></div>
        </div>
        <div class="dashboard-panel reminders-panel">
          <div class="section-title">Recordatorios</div>
          <div id="remindersList" class="reminder-list"></div>
        </div>
      </section>

      <div id="appointmentDetail" class="detail-modal" hidden></div>
      <div id="servicesList" hidden></div>
      <button id="addServiceBtn" hidden type="button">Agregar servicio</button>
      <span id="servicesCount" hidden>0</span>
      <span id="specialistContact" hidden></span>

      <div class="modal-backdrop" id="editProfileModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:200;align-items:center;justify-content:center">
        <div class="modal-box" style="background:#fff;padding:20px;border-radius:12px;max-width:420px;width:100%">
          <h3>Editar perfil</h3>
          <div style="display:grid;gap:8px;margin-top:10px">
            <input id="profileNameInput" placeholder="Nombre completo" style="padding:10px;border:1px solid var(--border-color);border-radius:8px">
            <input id="profileEmailInput" placeholder="Correo" style="padding:10px;border:1px solid var(--border-color);border-radius:8px">
            <input id="profilePhoneInput" placeholder="Teléfono" style="padding:10px;border:1px solid var(--border-color);border-radius:8px">
            <div style="display:flex;gap:8px;align-items:center">
              <label for="profileAvatarInput" class="btn secondary" style="margin:0;cursor:pointer">Subir foto</label>
              <input id="profileAvatarInput" type="file" accept="image/*" style="display:none">
              <small id="avatarFileName" class="meta">Ningún archivo seleccionado</small>
            </div>
            <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:6px">
              <button id="cancelEditProfile" type="button" class="btn secondary">Cancelar</button>
              <button id="saveEditProfile" type="button" class="btn">Guardar</button>
            </div>
          </div>
        </div>
      </div>

    <!-- Add service modal (simple) -->
    <div class="modal-backdrop" id="addServiceModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:200;align-items:center;justify-content:center">
      <div class="modal-box" style="background:#fff;padding:20px;border-radius:12px;max-width:520px;width:100%">
        <h3>Agregar servicio</h3>
        <div style="display:grid;gap:8px;margin-top:10px">
          <input id="serviceTitleInput" placeholder="Título del servicio" style="padding:10px;border:1px solid var(--border-color);border-radius:8px">
          <input id="serviceDurationInput" placeholder="Duración (ej. 60 minutos)" style="padding:10px;border:1px solid var(--border-color);border-radius:8px">
          <input id="servicePriceInput" placeholder="Precio (ej. $450 MXN)" style="padding:10px;border:1px solid var(--border-color);border-radius:8px">
          <textarea id="serviceDescInput" placeholder="Descripción" style="padding:10px;border:1px solid var(--border-color);border-radius:8px"></textarea>
          <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:6px">
            <button id="cancelAddService" type="button" class="btn secondary">Cancelar</button>
            <button id="saveAddService" type="button" class="btn">Agregar</button>
          </div>
        </div>
      </div>
    </div>
    </main>
  </div>

  <script src="appointments-system.js"></script>
  <script src="specialist-dashboard.js"></script>
</body>
</html>
