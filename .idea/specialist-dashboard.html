<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel del especialista - SGC Cosmetic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="appointments-system.js"></script>
  <style>
    :root { --primary-dark:#1A2A1A; --primary-green:#526B4A; --primary-hover:#3E5237; --accent-green:#B2D296; --bg-light:#F4F7F2; --card-bg:#FFFFFF; --text-main:#2C3527; --text-muted:#666666; --border-color:rgba(0,0,0,0.08); --danger:#c95c5c; }
    *{box-sizing:border-box;margin:0;padding:0} body,html{font-family:'Inter',sans-serif;background:var(--bg-light);color:var(--text-main);min-height:100%}
    .shell{min-height:100vh;background:linear-gradient(135deg,#f4f7f2 0%,#eef3eb 100%);padding:28px}
    .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
    .brand{font-family:'Cormorant Garamond',serif;font-size:1.6rem;color:var(--primary-dark)}
    .topbar-actions{display:flex;gap:12px;align-items:center}
    .pill{padding:10px 14px;border-radius:999px;background:#fff;border:1px solid var(--border-color);font-weight:700;color:var(--primary-green)}
    .grid{display:grid;grid-template-columns:1.1fr .9fr;gap:20px}
    .card{background:#fff;border-radius:24px;padding:22px;box-shadow:0 10px 30px rgba(0,0,0,0.08)}
    .section-title{font-size:1.05rem;font-weight:700;margin-bottom:12px}
    .appointment-list{display:flex;flex-direction:column;gap:10px}
    .appointment-item{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border-color);padding:14px 16px;border-radius:14px;cursor:pointer;background:#fbfdfb}
    .appointment-item.active{border-color:var(--primary-green);background:#eef5e7}
    .meta{font-size:0.85rem;color:var(--text-muted)}
    .detail-card{margin-top:14px;padding:16px;border-radius:16px;background:#fcfdfb;border:1px solid var(--border-color)}
    .detail-grid{display:grid;grid-template-columns:repeat(2, minmax(0,1fr));gap:12px;margin-top:10px}
    .detail-grid div{background:#fff;padding:12px;border-radius:12px;border:1px solid var(--border-color)}
    .detail-grid strong{display:block;margin-top:4px}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
    .stat{padding:12px;border-radius:14px;background:#f8fbf7;border:1px solid var(--border-color)}
    .stat strong{display:block;font-size:1.15rem;margin-top:4px}
    .filters{display:flex;gap:10px;margin-bottom:12px}
    .filter-btn{padding:8px 12px;border-radius:999px;border:1px solid var(--border-color);background:#f7f9f5;cursor:pointer;font-weight:700}
    .filter-btn.active{background:var(--primary-green);color:#fff;border-color:var(--primary-green)}
    .profile-card{display:flex;gap:14px;align-items:center;margin-bottom:16px}
    .avatar{width:70px;height:70px;border-radius:50%;object-fit:cover}
    .service-list{display:flex;flex-direction:column;gap:10px;margin-top:10px}
    .service-item{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--border-color)}
    .service-item button{border:none;background:var(--primary-green);color:#fff;padding:8px 10px;border-radius:999px;cursor:pointer}
    .service-item button.danger{background:var(--danger)}
    .toolbar{display:flex;justify-content:flex-end;margin-top:10px}
    .btn{padding:10px 14px;border:none;border-radius:999px;cursor:pointer;font-weight:700;background:var(--primary-green);color:#fff}
    .btn.secondary{background:#fff;border:1px solid var(--border-color);color:var(--text-main)}
    @media (max-width: 980px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <div class="brand">Panel del especialista</div>
      <div class="topbar-actions">
        <button class="btn secondary" onclick="(window.sgcAuth && typeof window.sgcAuth.signOut === 'function') ? window.sgcAuth.signOut() : window.location.href='Loggin.html'">Cerrar sesión</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><span>Citas hoy</span><strong id="todayCount">0</strong></div>
      <div class="stat"><span>Próximas</span><strong id="upcomingCount">0</strong></div>
      <div class="stat"><span>Servicios activos</span><strong id="servicesCount">0</strong></div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="section-title">Agenda</div>
        <div class="filters">
          <button class="filter-btn active" data-range="day">Día</button>
          <button class="filter-btn" data-range="week">Semana</button>
          <button class="filter-btn" data-range="month">Mes</button>
        </div>
        <div class="appointment-list" id="appointmentList"></div>
        <div class="detail-card" id="appointmentDetail"></div>
      </div>
      <div class="card">
        <div class="section-title">Perfil del especialista</div>
        <div class="profile-card">
          <img class="avatar" src="https://i.pravatar.cc/150?img=15" alt="Especialista">
          <div>
            <h3 id="specialistName">Dra. Sofía Vega</h3>
            <p id="specialistRole" class="meta">Especialista en estética facial</p>
            <p id="specialistContact" class="meta">sofia@sgc.com · +52 55 1111 2222</p>
          </div>
        </div>
        <div class="section-title">Servicios que maneja</div>
        <div class="service-list" id="servicesList"></div>
        <div class="toolbar">
          <button class="btn" id="addServiceBtn">Agregar servicio</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const specialistState = {
      appointments: [
        { id: 'apt-1', client: 'Ana López', service: 'Limpieza facial profunda', date: 'Hoy', time: '09:30', duration: '45 min', phone: '+52 55 1234 5678', history: ['Tratamiento previo', 'Seguimiento mensual'] },
        { id: 'apt-2', client: 'Mónica Ruiz', service: 'Microdermoabrasión', date: 'Hoy', time: '12:00', duration: '30 min', phone: '+52 55 4444 2222', history: ['Cita confirmada'] },
        { id: 'apt-3', client: 'Valeria Soto', service: 'Masaje relajante', date: 'Mañana', time: '16:00', duration: '60 min', phone: '+52 55 6666 7777', history: ['Cliente recurrente'] }
      ]
    };

    let selectedAppointmentId = null;

    function getSharedServices() {
      const system = window.appointmentsSystem;
      if (system && typeof system.getServices === 'function') {
        return system.getServices(system.readState());
      }
      return [];
    }

    function getSharedAppointments() {
      const system = window.appointmentsSystem;
      const state = system && typeof system.readState === 'function' ? system.readState() : null;
      if (state && Array.isArray(state.appointments)) {
        return state.appointments.filter((item) => item.status !== 'cancelled');
      }
      return specialistState.appointments;
    }

    function renderSpecialistDashboard() {
      const appointments = getSharedAppointments();
      const services = getSharedServices();
      const activeAppointments = appointments.length ? appointments : specialistState.appointments;
      if (!selectedAppointmentId || !activeAppointments.some((item) => item.id === selectedAppointmentId)) {
        selectedAppointmentId = activeAppointments[0]?.id || null;
      }

      document.getElementById('todayCount').textContent = activeAppointments.filter((item) => item.status === 'pending').length;
      document.getElementById('upcomingCount').textContent = activeAppointments.filter((item) => item.status === 'pending').length;
      document.getElementById('servicesCount').textContent = services.length;
      const list = document.getElementById('appointmentList');
      list.innerHTML = activeAppointments.map((appointment) => `
        <button class="appointment-item ${appointment.id === selectedAppointmentId ? 'active' : ''}" data-id="${appointment.id}">
          <div>
            <strong>${appointment.serviceName || appointment.service}</strong>
            <div class="meta">${appointment.date} · ${appointment.time}</div>
          </div>
          <span class="pill">${appointment.price || appointment.duration}</span>
        </button>
      `).join('');

      list.querySelectorAll('.appointment-item').forEach((button) => {
        button.addEventListener('click', () => {
          selectedAppointmentId = button.dataset.id;
          renderSpecialistDashboard();
        });
      });

      const detail = document.getElementById('appointmentDetail');
      const selected = activeAppointments.find((item) => item.id === selectedAppointmentId) || activeAppointments[0];
      if (selected) {
        const cb = selected.createdBy || {};
        detail.innerHTML = `
          <h4>${selected.serviceName || selected.service}</h4>
          <p class="meta">${selected.date} · ${selected.time}</p>
          <div style="display:flex;gap:12px;align-items:center;margin-top:10px">
            <img src="${cb.avatar || 'https://i.pravatar.cc/150?img=47'}" alt="${cb.name || 'Cliente'}" class="avatar">
            <div>
              <div><strong>${cb.name || selected.client || 'Cliente SGC'}</strong></div>
              <div class="meta">${cb.email || ''} ${cb.phone ? '· ' + cb.phone : ''}</div>
            </div>
          </div>
          <div class="detail-grid">
            <div><span>Precio</span><strong>${selected.price || selected.duration}</strong></div>
            <div><span>Servicio</span><strong>${selected.serviceName || selected.service}</strong></div>
            <div><span>Horario</span><strong>${selected.time}</strong></div>
            <div><span>Estado</span><strong>${selected.summary}</strong></div>
          </div>
          <div style="margin-top:12px"><strong>Resumen</strong><p class="meta" style="margin-top:6px;">${selected.summary || 'Cita pendiente de atención.'}</p></div>
        `;
      }

      // update specialist profile info from shared users/state
      try {
        const system = window.appointmentsSystem;
        const session = system && typeof system.getSession === 'function' ? system.getSession() : null;
        const users = system && typeof system.readUsers === 'function' ? system.readUsers() : [];
        let specialistUser = null;
        if (session && session.email) {
          specialistUser = users.find(u => u.email && u.email.toLowerCase() === session.email.toLowerCase());
        }
        if (!specialistUser) {
          specialistUser = users.find(u => u.role === 'specialist') || null;
        }
        if (specialistUser) {
          const avatarEl = document.querySelector('.profile-card .avatar');
          if (avatarEl) avatarEl.src = specialistUser.avatar || avatarEl.src;
          const nameEl = document.getElementById('specialistName');
          if (nameEl) nameEl.textContent = `${specialistUser.name} ${specialistUser.lastName || ''}`.trim();
          const roleEl = document.getElementById('specialistRole');
          if (roleEl) roleEl.textContent = specialistUser.roleDescription || 'Especialista en estética facial';
          const contactEl = document.getElementById('specialistContact');
          if (contactEl) contactEl.textContent = `${specialistUser.email} · ${specialistUser.phone || ''}`.trim();
        }
      } catch (e) { /* ignore */ }

      const servicesList = document.getElementById('servicesList');
      servicesList.innerHTML = services.map((service) => `
        <div class="service-item">
          <div>
            <strong>${service.title || service.name}</strong>
            <div class="meta">Duración: ${service.duration} · ${service.price}</div>
          </div>
          <button class="danger" onclick="removeService('${service.id}')">Eliminar</button>
        </div>
      `).join('');
    }

    function removeService(id) {
      const system = window.appointmentsSystem;
      if (system && typeof system.removeService === 'function') {
        system.removeService(id);
      } else {
        const services = getSharedServices().filter((service) => service.id !== id);
        if (window.appointmentsSystem && typeof window.appointmentsSystem.createService === 'function') {
          const state = window.appointmentsSystem.readState();
          state.services = services;
          localStorage.setItem('sgc_appointments_state_v1', JSON.stringify(state));
          window.dispatchEvent(new Event('sgc-state-updated'));
        }
      }
      renderSpecialistDashboard();
    }

    document.getElementById('addServiceBtn').addEventListener('click', () => {
      const modal = document.getElementById('addServiceModal');
      if (modal) modal.classList.add('active');
    });

    document.querySelectorAll('.filter-btn').forEach((button) => {
      button.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach((item) => item.classList.remove('active'));
        button.classList.add('active');
        document.getElementById('todayLabel').textContent = button.dataset.range === 'day' ? 'Hoy' : button.dataset.range === 'week' ? 'Semana' : 'Mes';
      });
    });

    window.addEventListener('sgc-state-updated', renderSpecialistDashboard);
    renderSpecialistDashboard();
  </script>
  <!-- Add Service Modal -->
  <div id="addServiceModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);align-items:center;justify-content:center;z-index:60">
    <div style="background:#fff;padding:18px;border-radius:12px;max-width:480px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,0.12);margin:0 16px">
      <h3>Agregar servicio</h3>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:8px">
        <input id="svcTitle" placeholder="Nombre del servicio" style="padding:8px;border-radius:8px;border:1px solid #e6e6e6">
        <input id="svcDuration" placeholder="Duración (ej. 45 min)" style="padding:8px;border-radius:8px;border:1px solid #e6e6e6">
        <input id="svcPrice" placeholder="Precio (ej. $450 MXN)" style="padding:8px;border-radius:8px;border:1px solid #e6e6e6">
        <input id="svcImage" placeholder="URL de imagen (opcional)" style="padding:8px;border-radius:8px;border:1px solid #e6e6e6">
        <textarea id="svcDescription" placeholder="Descripción" rows="3" style="padding:8px;border-radius:8px;border:1px solid #e6e6e6"></textarea>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px">
          <button id="svcCancel" class="btn secondary" style="background:#fff;border:1px solid #ddd;color:#333">Cancelar</button>
          <button id="svcSave" class="btn">Guardar</button>
        </div>
      </div>
    </div>
  </div>
  <script>
    (function(){
      const modal = document.getElementById('addServiceModal');
      const svcCancel = document.getElementById('svcCancel');
      const svcSave = document.getElementById('svcSave');
      if (svcCancel) svcCancel.addEventListener('click', () => { if (modal) modal.classList.remove('active'); });
      if (svcSave) svcSave.addEventListener('click', () => {
        const title = document.getElementById('svcTitle')?.value?.trim();
        if (!title) { alert('Ingresa el nombre del servicio.'); return; }
        const duration = document.getElementById('svcDuration')?.value?.trim() || '45 min';
        const price = document.getElementById('svcPrice')?.value?.trim() || '$0 MXN';
        const image = document.getElementById('svcImage')?.value?.trim() || 'https://images.unsplash.com/photo-1522337660859-02fbefca4702?auto=format&fit=crop&q=80&w=500';
        const description = document.getElementById('svcDescription')?.value?.trim() || '';
        const system = window.appointmentsSystem;
        if (system && typeof system.createService === 'function') {
          system.createService({ title, duration, price, image, description, category: 'General', includes: '' });
          if (modal) modal.classList.remove('active');
          renderSpecialistDashboard();
        } else {
          alert('No es posible crear el servicio en este momento.');
        }
      });
      // show/hide using class
      const observer = new MutationObserver(() => {
        if (!modal) return;
        modal.style.display = modal.classList.contains('active') ? 'flex' : 'none';
      });
      if (modal) observer.observe(modal, { attributes: true, attributeFilter: ['class'] });
    })();
  </script>
</body>
</html>
